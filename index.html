<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LuxWear Premium | QR Management v2.0</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #FFD700; /* Oltin rang */
            --bg: #000000;
            --card-bg: #121212;
            --text-main: #FFFFFF;
            --text-gray: #888888;
            --accent: #1DB954;
            --danger: #FF4D4D;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* --- Header (Sizning dizayn) --- */
        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            position: sticky; top: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); z-index: 100;
        }

        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-box {
            background: var(--primary); color: #000;
            padding: 8px 12px; font-weight: 800; border-radius: 8px; font-size: 20px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }
        .logo-text h1 { font-size: 18px; letter-spacing: 1px; }
        .logo-text p { font-size: 10px; color: var(--text-gray); text-transform: uppercase; }

        /* --- Navigation --- */
        nav {
            position: fixed; bottom: 0; width: 100%;
            background: rgba(0,0,0,0.9); border-top: 1px solid #222;
            display: flex; justify-content: space-around; padding: 15px 0; z-index: 100;
            backdrop-filter: blur(10px);
        }
        .nav-btn {
            background: none; border: none; color: var(--text-gray);
            font-size: 12px; cursor: pointer; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .nav-btn i { font-size: 20px; }
        .nav-btn.active { color: var(--primary); text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }

        /* --- Content Sections --- */
        .section { display: none; padding: 20px; padding-bottom: 120px; animation: fadeIn 0.4s ease; }
        .section.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Scanner Styling --- */
        .scanner-card {
            background: var(--card-bg); border-radius: 20px; padding: 20px; text-align: center;
            border: 1px solid #333; margin-top: 20px;
        }
        #reader { width: 100%; border-radius: 15px; overflow: hidden; margin: 15px 0; border: 1px dashed var(--primary); }
        .camera-btn {
            background: var(--primary); color: #000; width: 100%; padding: 15px;
            border-radius: 12px; font-weight: bold; border: none; margin-top: 15px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
        }

        /* --- Admin & Grid --- */
        .admin-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .add-btn { background: var(--primary); color: #000; padding: 10px 18px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        
        .product-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .product-card {
            background: var(--card-bg); border-radius: 20px; padding: 15px; border: 1px solid #222;
            display: flex; align-items: center; gap: 15px; position: relative;
            transition: 0.3s;
        }
        .qr-small { background: #fff; padding: 5px; border-radius: 10px; min-width: 85px; height: 85px; }
        .card-info { flex: 1; }
        .card-info h4 { font-size: 16px; margin-bottom: 4px; }
        .card-info p { color: var(--primary); font-weight: bold; font-size: 15px; }
        .tags-row { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
        .tag { background: #252525; color: #ccc; padding: 3px 8px; border-radius: 5px; font-size: 10px; border: 1px solid #333; }
        .delete-icon { position: absolute; top: 15px; right: 15px; color: var(--danger); opacity: 0.6; }

        /* --- Custom Inputs & Chips --- */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-gray); margin-bottom: 10px; }
        
        /* Slider (Range) Customization */
        input[type="range"] {
            width: 100%; -webkit-appearance: none; background: #333; height: 6px; border-radius: 5px; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 20px; width: 20px; background: var(--primary); border-radius: 50%; cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* Chips */
        .chip-container { display: flex; flex-wrap: wrap; gap: 10px; }
        .chip {
            padding: 10px 15px; background: #1a1a1a; border: 1px solid #333; border-radius: 10px;
            font-size: 13px; cursor: pointer; transition: 0.2s;
        }
        .chip.active { background: var(--primary); color: #000; border-color: var(--primary); font-weight: bold; }

        /* --- Stats Styling --- */
        .stats-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
        .stat-item { background: var(--card-bg); padding: 20px; border-radius: 20px; border: 1px solid #222; }
        .stat-item span { font-size: 12px; color: var(--text-gray); }
        .stat-item h2 { margin-top: 5px; color: var(--primary); }

        /* --- Modal --- */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1000; display: none;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--card-bg); width: 90%; max-width: 450px;
            padding: 25px; border-radius: 25px; border: 1px solid #333;
            max-height: 90vh; overflow-y: auto;
        }
        input[type="text"] { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; outline: none; }
        .btn-save { background: var(--primary); color: #000; width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; margin-top: 20px; font-size: 16px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-box">LX</div>
            <div class="logo-text">
                <h1>LuxWear</h1>
                <p>Premium Boutique</p>
            </div>
        </div>
        <i class="fas fa-chart-bar" style="color: var(--primary); font-size: 20px;"></i>
    </header>

    <section id="scanner" class="section active">
        <div class="scanner-card">
            <h2>Mahsulotni skanerlang</h2>
            <p style="color: var(--text-gray); font-size: 13px; margin-top: 5px;">Kamerani QR kodga qarating</p>
            <div id="reader"></div>
            <button class="camera-btn" onclick="toggleCamera()">
                <i class="fas fa-camera"></i> Kamerani yoqish
            </button>
        </div>
    </section>

    <section id="admin" class="section">
        <div class="admin-controls">
            <h2>Mahsulotlar</h2>
            <button class="add-btn" onclick="openAddModal()">+ Yangi qo'shish</button>
        </div>
        <div id="product-list" class="product-grid"></div>
    </section>

    <section id="tahlil" class="section">
        <h2 style="margin-bottom: 15px;">Daromad tahlili</h2>
        <div class="stats-summary">
            <div class="stat-item" style="grid-column: span 2;">
                <span>Jami tushum</span>
                <h2 id="total-sales">0 so'm</h2>
            </div>
            <div class="stat-item">
                <span>Sof foyda</span>
                <h2 id="net-profit">0 so'm</h2>
            </div>
            <div class="stat-item">
                <span>Sotilgan tovar</span>
                <h2 id="items-sold">0 ta</h2>
            </div>
        </div>
    </section>

    <nav>
        <button class="nav-btn active" onclick="showTab('scanner', this)">
            <i class="fas fa-qrcode"></i><span>Skaner</span>
        </button>
        <button class="nav-btn" onclick="showTab('admin', this)">
            <i class="fas fa-box"></i><span>Admin</span>
        </button>
        <button class="nav-btn" onclick="showTab('tahlil', this)">
            <i class="fas fa-chart-line"></i><span>Tahlil</span>
        </button>
    </nav>

    <div id="addModal" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--primary); margin-bottom: 20px;">Yangi mahsulot qo'shish</h3>
            
            <div class="form-group">
                <label>Mahsulot nomi</label>
                <input type="text" id="p-name" placeholder="Masalan: Oversize Hoodie">
            </div>

            <div class="form-group">
                <label>Sotish narxi: <b id="lbl-price" style="color:var(--primary)">500,000</b> so'm</label>
                <input type="range" id="p-price" min="10000" max="5000000" step="10000" value="500000" oninput="updateVal('lbl-price', this.value)">
            </div>

            <div class="form-group">
                <label>Tan narxi: <b id="lbl-cost" style="color:var(--primary)">300,000</b> so'm</label>
                <input type="range" id="p-cost" min="10000" max="5000000" step="10000" value="300000" oninput="updateVal('lbl-cost', this.value)">
            </div>

            <div class="form-group">
                <label>O'lcham</label>
                <div class="chip-container" id="size-chips">
                    <div class="chip" onclick="selectChip(this, 'size')">S</div>
                    <div class="chip" onclick="selectChip(this, 'size')">M</div>
                    <div class="chip" onclick="selectChip(this, 'size')">L</div>
                    <div class="chip" onclick="selectChip(this, 'size')">XL</div>
                    <div class="chip" onclick="selectChip(this, 'size')">XXL</div>
                </div>
            </div>

            <div class="form-group">
                <label>Rang</label>
                <div class="chip-container" id="color-chips">
                    <div class="chip" onclick="selectChip(this, 'color')">Qora</div>
                    <div class="chip" onclick="selectChip(this, 'color')">Oq</div>
                    <div class="chip" onclick="selectChip(this, 'color')">Kulrang</div>
                    <div class="chip" onclick="selectChip(this, 'color')">Sariq</div>
                    <div class="chip" onclick="selectChip(this, 'color')">Ko'k</div>
                </div>
            </div>

            <button class="btn-save" onclick="handleSave()">Bazaga saqlash</button>
            <button onclick="closeAddModal()" style="width:100%; background:none; border:none; color:#888; margin-top:10px;">Bekor qilish</button>
        </div>
    </div>

    <div id="resultModal" class="modal">
        <div class="modal-content" id="scan-res-body"></div>
    </div>

    <script>
        let inventory = JSON.parse(localStorage.getItem('lx_inv')) || [];
        let sales = JSON.parse(localStorage.getItem('lx_sales')) || [];
        let scanner = null;
        let selSize = "", selColor = "";

        function showTab(id, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
            if(id === 'admin') renderProducts();
            if(id === 'tahlil') renderStats();
            if(scanner) { scanner.stop(); scanner = null; }
        }

        function updateVal(id, val) {
            document.getElementById(id).innerText = parseInt(val).toLocaleString();
        }

        function selectChip(el, type) {
            el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            if(type === 'size') selSize = el.innerText;
            if(type === 'color') selColor = el.innerText;
        }

        function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
        function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }

        function handleSave() {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const cost = document.getElementById('p-cost').value;

            if(!name || !selSize || !selColor) return alert("Ma'lumotlarni to'liq tanlang!");

            const product = {
                id: "LX" + Date.now(),
                name, price: parseInt(price), cost: parseInt(cost),
                size: selSize, color: selColor
            };

            inventory.push(product);
            localStorage.setItem('lx_inv', JSON.stringify(inventory));
            closeAddModal();
            renderProducts();
        }

        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = "";
            inventory.forEach(p => {
                const div = document.createElement('div');
                div.className = 'product-card';
                div.innerHTML = `
                    <div class="qr-small" id="qr-${p.id}"></div>
                    <div class="card-info">
                        <h4>${p.name}</h4>
                        <p>${p.price.toLocaleString()} so'm</p>
                        <div class="tags-row">
                            <span class="tag">${p.size}</span>
                            <span class="tag">${p.color}</span>
                        </div>
                    </div>
                    <i class="fas fa-trash-alt delete-icon" onclick="deleteItem('${p.id}')"></i>
                `;
                list.appendChild(div);
                new QRCode(document.getElementById(`qr-${p.id}`), { text: p.id, width: 85, height: 85 });
            });
        }

        function deleteItem(id) {
            if(confirm("O'chirilsinmi?")) {
                inventory = inventory.filter(i => i.id !== id);
                localStorage.setItem('lx_inv', JSON.stringify(inventory));
                renderProducts();
            }
        }

        function toggleCamera() {
            if(scanner) { scanner.stop(); scanner = null; return; }
            scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                const p = inventory.find(i => i.id === text);
                const resBody = document.getElementById('scan-res-body');
                if(p) {
                    resBody.innerHTML = `
                        <h2 style="color:var(--accent)">Topildi!</h2>
                        <div style="margin:20px 0; padding:15px; background:#1a1a1a; border-radius:15px;">
                            <h3>${p.name}</h3>
                            <p style="font-size:22px; color:var(--primary); margin:10px 0;">${p.price.toLocaleString()} so'm</p>
                            <p>O'lcham: ${p.size} | Rang: ${p.color}</p>
                        </div>
                        <button class="btn-save" style="background:var(--accent)" onclick="confirmSale('${p.id}')">Sotuvni tasdiqlash</button>
                        <button onclick="closeRes()" style="width:100%; background:none; border:none; color:#888; margin-top:10px;">Yopish</button>
                    `;
                } else {
                    resBody.innerHTML = `<h2>Topilmadi</h2><button class="btn-save" onclick="closeRes()">Yopish</button>`;
                }
                document.getElementById('resultModal').style.display = 'flex';
                scanner.stop(); scanner = null;
            });
        }

        function confirmSale(id) {
            const idx = inventory.findIndex(i => i.id === id);
            if(idx > -1) {
                const sold = inventory.splice(idx, 1)[0];
                sales.push({...sold, date: new Date().toISOString()});
                localStorage.setItem('lx_inv', JSON.stringify(inventory));
                localStorage.setItem('lx_sales', JSON.stringify(sales));
                alert("Sotildi!");
                closeRes();
                renderProducts();
            }
        }

        function closeRes() { document.getElementById('resultModal').style.display = 'none'; }

        function renderStats() {
            const total = sales.reduce((a, b) => a + b.price, 0);
            const profit = sales.reduce((a, b) => a + (b.price - b.cost), 0);
            document.getElementById('total-sales').innerText = total.toLocaleString() + " so'm";
            document.getElementById('net-profit').innerText = profit.toLocaleString() + " so'm";
            document.getElementById('items-sold').innerText = sales.length + " ta";
        }

        window.onload = renderProducts;
    </script>
</body>
</html>
